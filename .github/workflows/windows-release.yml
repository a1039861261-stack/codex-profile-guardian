name: Windows release

on:
  push:
    branches: ['ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new official Release after all checks (main only; never install locally)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10.29.2'
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated build dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'venv failed' }
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
          pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependencies failed' }
      - name: Full tests, build, privacy checks and isolated installer acceptance
        run: .\tools\build-release.ps1 -IsolatedHostedRunner
      - name: Verify release assets and provenance
        run: .\tools\verify-release-assets.ps1 -OutputRoot output -ExpectedCommit $env:GITHUB_SHA
      - name: Isolated conflict-diagnostic browser acceptance
        run: |
          Get-Command npx.cmd -ErrorAction Stop | Out-Null
          .\.venv\Scripts\python.exe -m pip install playwright==1.55.0
          if ($LASTEXITCODE -ne 0) { throw 'Browser acceptance dependency failed' }
          .\.venv\Scripts\python.exe -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Isolated browser install failed' }
          .\.venv\Scripts\python.exe tools/verify-history-conflict-ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Conflict diagnostic UI acceptance failed' }
          .\.venv\Scripts\python.exe tools/verify-codex-close-ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Codex close UI acceptance failed' }
      - name: Retain only the four public release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: |
            output/CodexProfileGuardianSetup-v*.exe
            output/Codex-Profile-Guardian-Windows-x64-v*.zip
            output/Codex-Profile-Guardian-v*-manifest.json
            output/Codex-Profile-Guardian-v*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: output
      - name: Reverify and publish without replacing any existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\tools\verify-release-assets.ps1 -OutputRoot output -ExpectedCommit $env:GITHUB_SHA
          .\tools\publish-github-release.ps1 -OutputRoot output -Commit $env:GITHUB_SHA

  verify_public:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: output
      - name: Verify anonymous public assets and production updater without installing
        run: |
          .\tools\verify-release-assets.ps1 -OutputRoot output -ExpectedCommit $env:GITHUB_SHA
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tempfile
          
          from backend.updater import (
              GitHubReleaseUpdater, UpdateError, REPOSITORY, RELEASES_API,
              _default_fetch, parse_version,
          )
          
          if not (os.name == "nt"
                  and os.environ.get("GITHUB_ACTIONS") == "true"
                  and os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted"
                  and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
                  and os.environ.get("GITHUB_REF") == "refs/heads/main"
                  and os.environ.get("GITHUB_REPOSITORY") == REPOSITORY):
              raise SystemExit("Public release verification is cloud-only")
          
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          expected_commit = os.environ["GITHUB_SHA"]
          headers = {"Accept": "application/vnd.github+json",
                     "User-Agent": "Codex-Profile-Guardian-Public-Verification"}
          release = json.loads(_default_fetch(RELEASES_API, headers, 1024 * 1024)[0])
          assert release["tag_name"] == "v" + version
          assert release["draft"] is False and release["prerelease"] is False
          names = (
              f"CodexProfileGuardianSetup-v{version}.exe",
              f"Codex-Profile-Guardian-Windows-x64-v{version}.zip",
              f"Codex-Profile-Guardian-v{version}-manifest.json",
              f"Codex-Profile-Guardian-v{version}-SHA256SUMS.txt",
          )
          assets = {item["name"]: item for item in release["assets"]}
          assert len(release["assets"]) == 4 and set(assets) == set(names)
          verified = []
          for name in names:
              source = Path("output") / name
              size = source.stat().st_size
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              assert assets[name]["size"] == size
              assert assets[name]["digest"] == "sha256:" + digest
              url = f"https://github.com/{REPOSITORY}/releases/download/v{version}/{name}"
              assert assets[name]["browser_download_url"] == url
              payload = _default_fetch(
                  url, {"Accept": "application/octet-stream",
                        "User-Agent": headers["User-Agent"]}, size
              )[0]
              assert len(payload) == size and hashlib.sha256(payload).hexdigest() == digest
              verified.append({"name": name, "bytes": size, "sha256": digest})
              del payload
          manifest = json.loads((Path("output") / names[2]).read_text(encoding="utf-8-sig"))
          assert manifest["version"] == version and manifest["source_commit"] == expected_commit
          assert manifest["source_tree"] and manifest["signed"] is False
          releases = json.loads(_default_fetch(
              f"https://api.github.com/repos/{REPOSITORY}/releases?per_page=100",
              headers, 1024 * 1024
          )[0])
          older = []
          for item in releases:
              if item.get("draft") is False and item.get("prerelease") is False:
                  try:
                      value = parse_version(item["tag_name"])
                  except UpdateError:
                      continue
                  if value < parse_version(version):
                      older.append(value)
          assert older, "Previous stable release must be observable"
          previous_version = ".".join(str(part) for part in max(older))
          launched = []
          with tempfile.TemporaryDirectory(prefix="guardian-public-release-") as temporary:
              root = Path(temporary)
              updater = GitHubReleaseUpdater(previous_version, root / "previous",
                                              launcher=lambda path: launched.append(str(path)))
              available = updater.check()
              assert available["state"] == "available" and available["latest_version"] == version, available
              downloaded = updater.download()
              assert downloaded["state"] == "downloaded" and downloaded["latest_version"] == version, downloaded
              installer = updater.root / ("v" + version) / names[0]
              assert installer.stat().st_size == verified[0]["bytes"]
              assert hashlib.sha256(installer.read_bytes()).hexdigest() == verified[0]["sha256"]
              try:
                  updater.install(confirmed=False)
              except UpdateError as error:
                  assert error.code == "update_install_confirmation_required"
              else:
                  raise AssertionError("Unconfirmed install was not refused")
              assert launched == []
              current = GitHubReleaseUpdater(version, root / "current",
                                             launcher=lambda path: launched.append(str(path)))
              status = current.check()
              assert status["state"] == "up_to_date" and status["latest_version"] == version, status
              assert launched == []
          print(json.dumps({
              "public_release_verified": True, "version": version,
              "source_commit": expected_commit, "anonymous_downloads_verified": verified,
              "updater_from": previous_version, "updater_states": ["available", "downloaded"],
              "current_version_state": "up_to_date",
              "install_confirmation_required": True, "installer_launches": 0,
              "private_data_used": False,
          }, ensure_ascii=False))
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Public download or updater verification failed; release retained for inspection' }
