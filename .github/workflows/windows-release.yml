name: Windows release

on:
  push:
    branches: ['ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new official Release after all checks (main only; never install locally)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10.29.2'
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated build dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'venv failed' }
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
          pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependencies failed' }
      - name: Full tests, build, privacy checks and isolated installer acceptance
        run: .\tools\build-release.ps1 -IsolatedHostedRunner
      - name: Verify release assets and provenance
        run: .\tools\verify-release-assets.ps1 -OutputRoot output -ExpectedCommit $env:GITHUB_SHA
      - name: Retain only the four public release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: |
            output/CodexProfileGuardianSetup-v*.exe
            output/Codex-Profile-Guardian-Windows-x64-v*.zip
            output/Codex-Profile-Guardian-v*-manifest.json
            output/Codex-Profile-Guardian-v*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: output
      - name: Reverify and publish without replacing any existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\tools\verify-release-assets.ps1 -OutputRoot output -ExpectedCommit $env:GITHUB_SHA
          .\tools\publish-github-release.ps1 -OutputRoot output -Commit $env:GITHUB_SHA
